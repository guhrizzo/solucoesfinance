<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Nexus Fi</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d14;
        color: #b6bdcc;
        font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        max-width: 420px;
        padding: 40px;
        text-align: center;
      }
      .dot {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: #11141d;
        border: 1px solid #1f2533;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 19px;
        color: #ffffff;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 11px 22px;
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: #1f6feb;
        cursor: pointer;
        transition: filter 0.15s ease;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .hint {
        margin-top: 18px;
        font-size: 13px;
        color: #555c70;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">⚡</div>
      <h1>Sem conexão com a internet</h1>
      <p>
        O Nexus Fi precisa de internet para funcionar. Verifique sua conexão e
        tente novamente.
      </p>
      <button id="retry" type="button">Tentar de novo</button>
      <div class="hint" id="hint"></div>
    </div>
    <script>
      const btn = document.getElementById('retry')
      const hint = document.getElementById('hint')

      function retry() {
        btn.disabled = true
        btn.textContent = 'Reconectando…'
        window.nexusDesktop?.retry()
        // se em 6s ainda estamos aqui, o main recarrega esta página e o botão volta
        setTimeout(() => {
          btn.disabled = false
          btn.textContent = 'Tentar de novo'
        }, 6000)
      }

      btn.addEventListener('click', retry)
      window.addEventListener('online', retry)

      if (window.nexusDesktop?.appVersion) {
        window.nexusDesktop.appVersion().then((v) => {
          hint.textContent = 'Versão ' + v
        })
      }
    </script>
  </body>
</html>
