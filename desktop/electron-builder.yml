appId: br.com.nexusfi.app
productName: Nexus Fi
copyright: © Nexus Fi

directories:
  output: build
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - package.json

# electron-updater lê este bloco pra gerar o app-update.yml embutido.
# GitHub Releases do repo público guhrizzo/solucoesfinance — download sem token.
# Publicar precisa de GH_TOKEN local (desktop/electron-builder.env).
publish:
  provider: github
  owner: guhrizzo
  repo: solucoesfinance

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  # Assinatura de código (Authenticode): o electron-builder assina sozinho quando
  # CSC_LINK (.pfx/.p12) + CSC_KEY_PASSWORD estão no ambiente — sem nada a mais aqui.
  # Sem certificado, o instalador sai sem assinatura e o SmartScreen avisa.
  # Ver desktop/README.md ("Assinatura de código").

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexus Fi
  deleteAppDataOnUninstall: false

# Nome FIXO (sem versão): o site baixa por releases/latest/download/Nexus-Fi-Setup.exe
# (ver lib/desktopDownload.ts). A versão fica no latest.yml e na tag da release.
artifactName: Nexus-Fi-Setup.${ext}
