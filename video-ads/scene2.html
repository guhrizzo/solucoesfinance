<!doctype html><meta charset=utf-8><style>@font-face{font-family:Sora;src:url(sora.woff2);font-weight:100 900}
@font-face{font-family:Hanken;src:url(hanken-grotesk.woff2);font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070b14;font-family:Hanken,sans-serif;color:#fff}
body{background:radial-gradient(1200px 900px at 50% -10%,#14305f 0%,#070b14 65%)}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:90px;text-align:center;opacity:0}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(#1f6feb66,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);z-index:-1;animation:breathe 4s ease-in-out infinite}
.glow.warn{background:radial-gradient(#e5484d55,transparent 65%)}
.glow.big{width:1400px;height:1400px}
.h1{font:800 150px/1.02 Sora;letter-spacing:-4px}
.h1.sm{font-size:120px}
.h2{font:700 84px/1.12 Sora;letter-spacing:-2px}
.h2.sm{font-size:78px}
.h2 b,.h1 b{color:#5aa2ff}
.red{color:#ff6b6b}
.sub{font:600 54px Hanken;color:#9db6dc}
.kicker{font:700 48px Hanken;letter-spacing:6px;text-transform:uppercase;color:#7fb0ff}
.badge{width:260px;height:260px;border-radius:70px;background:linear-gradient(145deg,#2f80ff,#1451b8);display:grid;place-items:center;box-shadow:0 30px 90px #1f6feb88}
.chart{width:900px;height:360px;margin-top:20px}
.logo{width:820px}
.logo.s{width:620px}
.check{width:170px;height:170px;border-radius:50%;background:#16a34a;display:grid;place-items:center;box-shadow:0 20px 70px #16a34a88}
.docs{position:relative;width:900px;height:600px}
.doc{position:absolute;width:260px;height:330px;background:#f4f6fa;border-radius:18px;padding:34px 28px;transform:rotate(var(--r));box-shadow:0 20px 50px #0008;display:flex;flex-direction:column;gap:22px}
.doc i{display:block;height:16px;border-radius:8px;background:#c3cbd9}
.kpis{display:flex;gap:26px;width:100%}
.kpi{flex:1;background:#101a2e;border:2px solid #22345a;border-radius:30px;padding:34px 24px;display:flex;flex-direction:column;gap:10px;text-align:left}
.kpi span{font:600 34px Hanken;color:#8aa0c4}
.kpi b{white-space:nowrap;font:800 38px Sora;letter-spacing:-1px}
.g{color:#4ade80}
.b{color:#5aa2ff}
.r{color:#ff7b7b}
.card{width:100%;height:420px;background:#101a2e;border:2px solid #22345a;border-radius:34px;padding:40px;display:flex;align-items:flex-end}
.bars{display:flex;align-items:flex-end;gap:22px;width:100%;height:100%}
.bars i{flex:1;background:linear-gradient(#5aa2ff,#1f6feb);border-radius:14px 14px 4px 4px;transform-origin:bottom}
.chips{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.chip{background:#fff;border-radius:20px;padding:16px 28px;display:grid;place-items:center}
.note{font:500 30px Hanken;color:#6c7f9f}
.chat{width:100%;display:flex;flex-direction:column;gap:26px;text-align:left}
.msg{max-width:84%;padding:34px 40px;border-radius:36px;font:500 46px/1.3 Hanken;color:#10202c}
.msg.in{background:#fff;border-bottom-left-radius:8px}
.msg.pix{font-family:monospace;font-size:40px;background:#e8f1ff}
.msg.out{background:#25d366;align-self:flex-end;border-bottom-right-radius:8px;font-weight:700}
.paid{font:800 100px Sora;color:#4ade80}
.cta{background:linear-gradient(135deg,#2f80ff,#1451b8);padding:46px 60px;white-space:nowrap;border-radius:999px;font:800 58px Sora;box-shadow:0 25px 80px #1f6feb99}
.url{font:600 54px Hanken;color:#9db6dc;letter-spacing:2px}
@keyframes scin{from{opacity:0}to{opacity:1}}
@keyframes scout{to{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}60%{transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-200px) rotate(var(--r))}to{opacity:1;transform:rotate(var(--r))}}
@keyframes draw{from{stroke-dasharray:1400;stroke-dashoffset:1400}to{stroke-dasharray:1400;stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.12)}}

.stage{position:relative;width:900px;height:640px;display:grid;place-items:center}
.ring{position:relative;z-index:2;width:560px;height:560px;border-radius:50%;background:linear-gradient(160deg,#2a4f94,#122447);border:6px solid #3b8bff;overflow:hidden;box-shadow:0 30px 90px #1f6feb66;animation-name:pop}
.person{width:100%;height:100%}.person img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.bulbwrap{position:absolute;z-index:3;right:70px;top:-10px;width:190px;height:190px;display:grid;place-items:center}
.bulbbadge{width:170px;height:170px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 90px #ffd34dcc}
.rays{position:absolute;inset:-30px}
.rays i{position:absolute;left:50%;top:50%;width:6px;height:36px;margin-left:-3px;background:#ffd34d;border-radius:4px;transform:rotate(var(--a)) translateY(-150px)}
.docs2{position:absolute;inset:0;z-index:1}
.doc.sm{width:170px;height:215px;padding:22px 18px;gap:14px;border-radius:14px}
.doc.sm i{height:11px}
.stage .ring{animation-name:pop,floaty}
@keyframes floaty{50%{transform:translateY(-14px)}}
</style><body>
<section class="sc" style="animation:scin .4s 2.77s both, scout .35s 8.15s forwards">
<div class="glow warn"></div>
<div class="kicker" style="animation:up 0.7s cubic-bezier(.2,.9,.3,1) 2.87s both;">Ela é inteligente</div>
<div class="stage">
  <div class="docs2"><div class="doc sm" style="left:-30px;top:330px;--r:-14deg;animation:drop 0.7s cubic-bezier(.2,.9,.3,1) 5.17s both;"><i></i><i></i><i style="width:55%"></i></div><div class="doc sm" style="left:790px;top:300px;--r:12deg;animation:drop 0.7s cubic-bezier(.2,.9,.3,1) 5.31s both;"><i></i><i></i><i style="width:55%"></i></div><div class="doc sm" style="left:-60px;top:120px;--r:-6deg;animation:drop 0.7s cubic-bezier(.2,.9,.3,1) 5.45s both;"><i></i><i></i><i style="width:55%"></i></div><div class="doc sm" style="left:830px;top:100px;--r:9deg;animation:drop 0.7s cubic-bezier(.2,.9,.3,1) 5.59s both;"><i></i><i></i><i style="width:55%"></i></div></div>
  <div class="ring" style="animation:pop 0.8s cubic-bezier(.2,.9,.3,1) 3.07s both;"><div class="person"><img src="face.jpg"></div></div>
  <div class="bulbwrap" style="animation:pop 0.7s cubic-bezier(.2,.9,.3,1) 3.67s both;"><div class="rays"><i style="--a:-60deg"></i><i style="--a:-30deg"></i><i style="--a:0deg"></i><i style="--a:30deg"></i><i style="--a:60deg"></i></div><div class="bulbbadge"><svg viewBox="0 0 48 48" width="110" height="110" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M24 5a13 13 0 0 0-7.5 23.6c1 .8 1.5 1.9 1.5 3.1V34h12v-2.3c0-1.2.5-2.3 1.5-3.1A13 13 0 0 0 24 5z" fill="#ffd34d" stroke="#b8860b" stroke-width="2"/>
<path d="M19 38h10M20.5 42h7" stroke="#8a94a2" stroke-width="3"/></svg></div></div>
</div>
<div class="h2" style="animation:up 0.7s cubic-bezier(.2,.9,.3,1) 5.07s both;">Crescer <b>sem organizar</b><br>as finanças é um <span class="red">risco</span>.</div>
</section>
