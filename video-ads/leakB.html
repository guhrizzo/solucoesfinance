<!doctype html><meta charset=utf-8><style>*{margin:0}html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
.lk{position:absolute;inset:0;opacity:0}.g{position:absolute;border-radius:50%;filter:blur(70px)}
.g.a{width:1500px;height:1600px}.g.b{width:900px;height:900px;background:radial-gradient(closest-side,#ffb347,#ff7a1888 60%,transparent)}.g.c{width:480px;height:480px}
.wash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#ffcf8a88,#ff8a4a33 60%,transparent);opacity:0}
@keyframes fl{0%{opacity:0}18%{opacity:.55}50%{opacity:1}62%{opacity:.8}80%{opacity:.55}100%{opacity:0}}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(calc(var(--x1) - var(--x0)))}}
@keyframes ws{0%,30%{opacity:0}50%{opacity:.85}70%,100%{opacity:0}}</style><body><div class="lk" style="animation:fl 0.9s linear 0s both">
 <div class="g a" style="left:1330px;top:400px;animation:mv 0.9s ease-in-out 0s both;--x0:1330px;--x1:820px;background:radial-gradient(closest-side,#5aa2ff,#7a4dff99 55%,transparent)"></div>
 <div class="g b" style="left:1330px;top:750px;animation:mv 0.9s ease-in-out .04s both;--x0:1330px;--x1:820px"></div>
 <div class="g c" style="left:1330px;top:980px;animation:mv 0.9s ease-in-out .07s both;--x0:1330px;--x1:820px;background:radial-gradient(closest-side,#e8f3ff,#e8f3ff99 55%,transparent)"></div>
 <div class="wash" style="animation:ws 0.9s ease-in-out 0s both"></div></div>
